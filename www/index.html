<style>

/* Concept: duela de madera oscura con líneas de cancha; el reproductor es un tablero con aro, la portada va en el cuadro naranja. Un solo look oscuro, a propósito. */
:root {
  --wood: #18120E;
  --wood-2: #211912;
  --wood-3: #2C2118;
  --wood-4: #3A2B1F;
  --orange: #F26522;
  --orange-hi: #FF8A4C;
  --chalk: #EFE7DA;
  --chalk-dim: #A99C8B;
  --line: rgba(239, 231, 218, .10);
  --font-display: Impact, 'Arial Narrow', 'sans-serif-condensed', 'Roboto Condensed', sans-serif;
  --font-body: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--wood);
  color: var(--chalk);
  font: 15px/1.45 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
  min-height: 100vh;
}
.floor {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    repeating-linear-gradient(90deg, transparent 0 139px, rgba(0, 0, 0, .22) 139px 140px),
    radial-gradient(1100px 560px at 50% -8%, rgba(242, 101, 34, .10), transparent 70%),
    var(--wood);
}
.floor svg { width: 100%; height: 100%; display: block; }
.app { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--orange-hi); outline-offset: 2px; }

header.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px 24px; margin-bottom: 22px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand .ball { width: 44px; height: 44px; border-radius: 50%; flex: none; }
.brand h1 { font: 700 clamp(34px, 6vw, 48px)/.95 var(--font-display); letter-spacing: .04em; margin: 0; }
.brand p { margin: 2px 0 0; color: var(--chalk-dim); font-size: 13px; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 2px solid var(--wood-4); background: var(--wood-2); padding: 9px 18px; border-radius: 999px; font-weight: 600; font-size: 14px; white-space: nowrap; }
.btn:hover { border-color: var(--chalk-dim); }
.btn.primary { background: var(--orange); border-color: var(--orange); color: var(--wood); }
.btn.primary:hover { background: var(--orange-hi); border-color: var(--orange-hi); }
.btn[disabled] { opacity: .45; cursor: default; }

.layout { display: grid; grid-template-columns: minmax(0, 520px) minmax(0, 1fr); gap: 26px; align-items: start; }
.left { display: flex; flex-direction: column; gap: 18px; min-width: 0; }

/* Tablero */
.board {
  position: relative; border: 5px solid var(--chalk); border-radius: 10px; padding: 18px 18px 16px;
  background: linear-gradient(150deg, rgba(239, 231, 218, .11), rgba(239, 231, 218, .03) 60%), var(--wood-2);
  box-shadow: 0 18px 40px rgba(0, 0, 0, .45), inset 0 0 0 2px rgba(24, 18, 14, .6);
}
.bolt { position: absolute; width: 9px; height: 9px; border-radius: 50%; background: var(--chalk-dim); box-shadow: inset 0 0 0 2px var(--wood); }
.bolt.a { top: 6px; left: 6px; } .bolt.b { top: 6px; right: 6px; } .bolt.c { bottom: 6px; left: 6px; } .bolt.d { bottom: 6px; right: 6px; }
.board-top { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 12px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--chalk-dim); }
.board-top span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.target { width: min(100%, 300px); aspect-ratio: 1; margin: 0 auto; border: 4px solid var(--orange); padding: 6px; background: var(--wood); }
.target > * { display: block; width: 100%; height: 100%; object-fit: cover; }
.scorebar { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: end; gap: 12px; margin-top: 14px; }
.led { font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1; letter-spacing: .06em; color: var(--orange); text-shadow: 0 0 12px rgba(242, 101, 34, .55); font-variant-numeric: tabular-nums; background: #0F0B08; border: 2px solid var(--wood-4); border-radius: 6px; padding: 6px 10px 4px; }
.led small { display: block; font: 600 10px/1 var(--font-body); letter-spacing: .14em; color: var(--chalk-dim); text-shadow: none; margin-bottom: 4px; }
canvas.spec { width: 100%; height: 48px; display: block; }
.info { text-align: center; margin-top: 14px; min-width: 0; }
.info h2 { margin: 0; font: 700 clamp(26px, 5vw, 34px)/1.05 var(--font-display); letter-spacing: .03em; overflow-wrap: anywhere; text-wrap: balance; }
.info p { margin: 4px 0 0; color: var(--chalk-dim); overflow-wrap: anywhere; }
.rim { display: block; width: 210px; max-width: 70%; margin: -4px auto 0; }

/* Controles */
.deck { border: 2px solid var(--wood-4); border-radius: 10px; background: rgba(33, 25, 18, .86); padding: 16px; display: grid; gap: 14px; }
.transport { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; }
.ib { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; border: 2px solid var(--wood-4); background: var(--wood-3); position: relative; }
.ib:hover { border-color: var(--chalk-dim); }
.ib.on { border-color: var(--orange); color: var(--orange); }
.ib .badge { position: absolute; right: 4px; bottom: 3px; font: 700 10px/1 var(--font-body); color: var(--orange); }
.ib.big { width: 62px; height: 62px; background: var(--orange); border-color: var(--orange); color: var(--wood); }
.ib.big:hover { background: var(--orange-hi); border-color: var(--orange-hi); }
.row { display: flex; align-items: center; gap: 12px; }
.row label { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--chalk-dim); min-width: 64px; }
.row .time { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--chalk-dim); min-width: 40px; text-align: right; }
input[type=range] { -webkit-appearance: none; appearance: none; background: transparent; width: 100%; height: 24px; margin: 0; cursor: pointer; }
input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--orange) var(--p, 0%), var(--wood-4) var(--p, 0%)); }
input[type=range]::-moz-range-track { height: 6px; border-radius: 3px; background: var(--wood-4); }
input[type=range]::-moz-range-progress { height: 6px; border-radius: 3px; background: var(--orange); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; box-sizing: border-box; width: 16px; height: 16px; border-radius: 50%; background: var(--chalk); border: 3px solid var(--orange); margin-top: -5px; }
input[type=range]::-moz-range-thumb { box-sizing: border-box; width: 16px; height: 16px; border-radius: 50%; background: var(--chalk); border: 3px solid var(--orange); }
.status { min-height: 20px; font-size: 13px; color: var(--orange-hi); text-align: center; }

/* Biblioteca */
.lib { border: 2px solid var(--wood-4); border-radius: 10px; background: rgba(33, 25, 18, .86); padding: 14px; min-width: 0; }
.tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
.tab { border: 0; background: transparent; padding: 8px 14px; border-radius: 8px; font-family: var(--font-display); font-weight: 700; font-size: 18px; letter-spacing: .08em; color: var(--chalk-dim); }
.tab.on { background: var(--orange); color: var(--wood); }
.tab:not(.on):hover { color: var(--chalk); background: var(--wood-3); }
.search { width: 100%; background: var(--wood-2); border: 2px solid var(--wood-4); border-radius: 999px; color: var(--chalk); padding: 11px 18px 11px 46px; font: inherit; }
.search:disabled { opacity: .6; }
.search::placeholder { color: var(--chalk-dim); }
.meta { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; color: var(--chalk-dim); margin-bottom: 8px; }
.list { max-height: 62vh; overflow-y: auto; display: grid; gap: 2px; padding-right: 2px; }
.item { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; align-items: center; gap: 12px; width: 100%; text-align: left; border: 0; background: transparent; padding: 6px 8px; border-radius: 8px; }
.item:hover { background: var(--wood-3); }
.item.on { background: var(--wood-3); }
.item .th { width: 44px; height: 44px; border: 2px solid var(--wood-4); overflow: hidden; background: var(--wood); }
.item .th > * { width: 100%; height: 100%; object-fit: cover; display: block; }
.item .t1 { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .t2 { font-size: 13px; color: var(--chalk-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item.on .t1 { color: var(--orange-hi); }
.item .side { font-size: 12.5px; color: var(--chalk-dim); font-variant-numeric: tabular-nums; }
.item .side.live { color: var(--orange-hi); font-weight: 600; }
.bars { display: inline-flex; align-items: flex-end; gap: 2px; height: 16px; }
.bars i { width: 3px; background: var(--orange); height: 100%; transform-origin: bottom; animation: bounce 0.9s ease-in-out infinite; }
.bars i:nth-child(2) { animation-delay: .2s; } .bars i:nth-child(3) { animation-delay: .4s; }
.bars.paused i { animation-play-state: paused; transform: scaleY(.3); }
@keyframes bounce { 0%, 100% { transform: scaleY(.25); } 50% { transform: scaleY(1); } }
.more { margin-top: 8px; width: 100%; justify-content: center; }
.empty { text-align: center; padding: 34px 14px; color: var(--chalk-dim); display: grid; gap: 12px; justify-items: center; }
.empty strong { font: 700 28px/1 var(--font-display); letter-spacing: .06em; color: var(--chalk); }
.empty .ball { width: 72px; height: 72px; border-radius: 50%; }
.loading { font-size: 13px; color: var(--orange-hi); margin-bottom: 8px; }

@media (max-width: 900px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .list { max-height: 55vh; }
}
@media (max-width: 440px) {
  .led { font-size: 26px; padding: 5px 8px 3px; }
  .board { padding: 14px 12px 12px; }
}
@media (prefers-reduced-motion: reduce) {
  .bars i { animation: none; transform: scaleY(.6); }
}
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); background: #18120E; }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }

/* ---- v3 ---- */
:root { --alien: #7BD957; }
header.top { margin-bottom: 14px; }
.searchbar { position: relative; flex: 1 1 280px; max-width: 560px; min-width: 0; }
.searchbar svg { position: absolute; left: 17px; top: 50%; transform: translateY(-50%); color: var(--chalk-dim); pointer-events: none; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
.btn.alien { border-color: #3F7A31; background: #16221A; }
.btn.alien:hover { border-color: var(--alien); box-shadow: 0 0 0 3px rgba(123, 217, 87, .16); }
.btn.alien svg { flex: none; }
.empty-art { width: 120px; height: 120px; border: 3px solid var(--orange); padding: 4px; background: var(--wood); }
.empty-art > * { display: block; width: 100%; height: 100%; }
.dribbler { display: block; width: 100%; height: 100%; }
.dribbler .dr-ball { transform: translateY(6px); }
.dribbler .dr-body, .dribbler .dr-arm, .dribbler .dr-legA, .dribbler .dr-legB { transform-origin: 44px 56px; }
.dribbler .dr-arm { transform-origin: 52px 33px; }
.dribbler .dr-bshadow { transform-origin: 70px 89.4px; opacity: .3; }
.dribbler.go .dr-ball { animation: drBall .72s infinite; }
.dribbler.go .dr-spin { animation: drSpin .72s linear infinite; }
.dribbler.go .dr-body { animation: drBob .72s ease-in-out infinite; }
.dribbler.go .dr-arm { animation: drArm .72s ease-in-out infinite; }
.dribbler.go .dr-legA { animation: drLegA 1.44s ease-in-out infinite; }
.dribbler.go .dr-legB { animation: drLegB 1.44s ease-in-out infinite; }
.dribbler.go .dr-bshadow { animation: drBS .72s infinite; }
@keyframes drBall { 0% { transform: translateY(0); animation-timing-function: cubic-bezier(.55, 0, 1, .45); } 50% { transform: translateY(16px); animation-timing-function: cubic-bezier(0, .55, .45, 1); } 100% { transform: translateY(0); } }
@keyframes drSpin { to { transform: rotate(360deg); } }
@keyframes drBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(1.6px); } }
@keyframes drArm { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(6deg); } }
@keyframes drLegA { 0%, 100% { transform: rotate(-9deg); } 50% { transform: rotate(9deg); } }
@keyframes drLegB { 0%, 100% { transform: rotate(9deg); } 50% { transform: rotate(-9deg); } }
@keyframes drBS { 0%, 100% { transform: scaleX(.55); opacity: .18; } 50% { transform: scaleX(1.25); opacity: .55; } }
@media (prefers-reduced-motion: reduce) { .dribbler.go * { animation: none !important; } }
@media (max-width: 440px) { .btn { padding: 9px 14px; } }

html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); background: #18120E; }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
/* ---- v4: me gusta, artistas en cuadrícula, listas ---- */
.item { grid-template-columns: minmax(0, 1fr) auto auto; gap: 2px; padding: 0 4px 0 0; width: 100%; }
.item.lrow { grid-template-columns: minmax(0, 1fr) auto auto auto; }
.item-main { display: grid; grid-template-columns: 44px minmax(0, 1fr); align-items: center; gap: 12px; text-align: left; border: 0; background: transparent; padding: 6px 0 6px 8px; min-width: 0; border-radius: 8px; color: inherit; }
.item .t1, .item .t2 { display: block; }
.lth { display: grid; place-items: center; color: var(--orange); }
.heart { width: 40px; height: 40px; flex: none; display: grid; place-items: center; border: 0; background: transparent; color: var(--chalk-dim); border-radius: 50%; }
.heart:hover { color: var(--chalk); background: var(--wood-4); }
.heart.on { color: var(--orange); }
.heart.big { width: 44px; height: 44px; }
.bigheart { color: var(--orange); }
.ttl { display: flex; align-items: center; justify-content: center; gap: 4px; min-width: 0; }
.ttl h2 { min-width: 0; }
.tabs { gap: 4px; }
.tab { font-size: 18px; padding: 8px 11px; }
.transport { gap: 8px; }
.minibar { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 10px; }
.btn.mini { padding: 6px 14px; font-size: 13px; }
.btn.danger { border-color: #B3392B; background: #3A1713; color: #FFB4A8; }
.back { display: inline-flex; align-items: center; gap: 4px; border: 0; background: transparent; color: var(--chalk-dim); font-weight: 600; padding: 4px 8px 4px 0; margin-bottom: 8px; }
.back:hover { color: var(--chalk); }
.aprofile { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 14px; align-items: center; margin-bottom: 12px; }
.aprofile h3 { margin: 0 0 2px; font: 700 30px/1 var(--font-display); letter-spacing: .04em; overflow-wrap: anywhere; }
.aph { display: block; width: 100%; aspect-ratio: 1; border-radius: 50%; overflow: hidden; border: 3px solid var(--wood-4); background: var(--wood); }
.aph > * { display: block; width: 100%; height: 100%; object-fit: cover; }
.aph.big { width: 96px; border-color: var(--orange); }
.agrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 16px 10px; padding: 2px; }
.acard { display: flex; flex-direction: column; align-items: center; gap: 6px; border: 0; background: transparent; padding: 8px 6px; border-radius: 14px; min-width: 0; text-align: center; color: inherit; }
.acard:hover { background: var(--wood-3); }
.acard:hover .aph { border-color: var(--chalk-dim); }
.acard.on .aph { border-color: var(--orange); }
.acard .an { font-weight: 600; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.acard .ac { font-size: 12px; color: var(--chalk-dim); }
@media (max-width: 440px) {
  .ib { width: 42px; height: 42px; }
  .ib.big { width: 58px; height: 58px; }
  .transport { gap: 6px; }
  .tab { font-size: 17px; padding: 7px 9px; }
}

/* ---- v5: rendimiento, marcador, balón, aro, Maza, menús ---- */
.floor { will-change: transform; transform: translateZ(0);
  background:
    repeating-linear-gradient(90deg, transparent 0 93px, rgba(0,0,0,.28) 93px 94px),
    repeating-linear-gradient(0deg, rgba(255,255,255,.012) 0 3px, transparent 3px 6px),
    radial-gradient(1100px 600px at 50% 0%, rgba(242,101,34,.16), transparent 70%),
    linear-gradient(180deg, #241811, #18120E 70%); }
.vl { height: 62vh; min-height: 260px; overflow-y: auto; position: relative; contain: strict; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.vrow { position: absolute; left: 0; right: 0; contain: layout paint; }
.vrow > .item { height: 100%; }
.item { height: 56px; }
.item .th { contain: strict; }
.sil { display: block; width: 100%; height: 100%; }
.agrow { display: grid; gap: 10px; height: 100%; padding: 2px; }
.aprofile .aph, .acard .aph { contain: paint; }
.subtabs { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.chip { border: 2px solid var(--wood-4); background: var(--wood-2); border-radius: 999px; padding: 6px 16px; font-weight: 600; font-size: 13px; display: inline-flex; gap: 6px; align-items: center; }
.chip.on { background: var(--orange); border-color: var(--orange); color: var(--wood); }
.chip.add { border-style: dashed; margin-left: auto; }
.lname { font: 700 22px/1 var(--font-display); letter-spacing: .04em; color: var(--chalk); }
.fpath { margin: -4px 0 6px; overflow-wrap: anywhere; }
.item .heart { width: 38px; }
.item { grid-template-columns: minmax(0, 1fr) auto auto auto; }
.item.lrow { grid-template-columns: minmax(0, 1fr) auto; }

/* marcador */
.stage { display: flex; justify-content: center; align-items: flex-end; gap: 12px; }
.stage .target { margin: 0; flex: 0 1 300px; }
.stage.withmaza .target { flex-basis: 220px; }
.maza { flex: 0 0 74px; text-align: center; }
.maza .mz { width: 74px; height: 74px; border: 3px solid var(--wood-4); background: var(--wood); border-radius: 8px; overflow: hidden; }
.maza .mz > * { width: 100%; height: 100%; display: block; }
.maza span { display: block; margin-top: 4px; font: 700 14px/1 var(--font-display); letter-spacing: .18em; color: var(--orange); }
.scoreboard { display: grid; grid-template-columns: 1fr auto 1fr; align-items: stretch; gap: 8px; margin-top: 14px; }
.scoreboard .led { text-align: center; }
.scoreboard .mid { display: grid; gap: 6px; text-align: center; min-width: 92px; }
.qtr { background: #0F0B08; border: 2px solid var(--wood-4); border-radius: 6px; padding: 5px 8px 3px; font: 700 28px/1 var(--font-display); color: #FFD34D; text-shadow: 0 0 10px rgba(255,211,77,.5); }
.qtr small { display: block; font: 600 9px/1 var(--font-body); letter-spacing: .14em; color: var(--chalk-dim); text-shadow: none; margin-bottom: 3px; }
.state { background: #0F0B08; border: 2px solid var(--wood-4); border-radius: 6px; padding: 4px 6px; font: 700 11px/1.2 var(--font-body); letter-spacing: .12em; color: var(--chalk-dim); }
.state.live { color: #7BD957; border-color: #3F7A31; box-shadow: 0 0 10px rgba(123,217,87,.35); }
.state.live::before { content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #7BD957; margin-right: 6px; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: .2; } }

/* play = pelota */
.ib.ballbtn { width: 68px; height: 68px; padding: 0; border: 0; background: transparent; box-shadow: 0 6px 14px rgba(0,0,0,.5); border-radius: 50%; }
.ib.ballbtn:hover { border: 0; filter: brightness(1.1); }
.ib.ballbtn:active { transform: scale(.94); }
.pball { width: 100%; height: 100%; display: block; }
.pball .seams { transform-origin: 50px 50px; }
.pball.spin .seams { animation: seamspin 2.4s linear infinite; }
@keyframes seamspin { to { transform: rotate(360deg); } }

/* aro */
.rim { display: block; width: 230px; max-width: 72%; margin: -8px auto 0; overflow: visible; }
.rim .rball { opacity: 0; }
.rim.shot .rball { animation: drop 1.1s cubic-bezier(.4,0,.8,.6) 1 both; }
.rim.shot .net { transform-origin: 110px 16px; animation: swish 1.1s ease-out 1; }
@keyframes drop { 0% { transform: translateY(-50px); opacity: 0; } 12% { opacity: 1; } 45% { transform: translateY(40px); opacity: 1; } 62% { transform: translateY(95px); opacity: 1; } 100% { transform: translateY(150px); opacity: 0; } }
@keyframes swish { 0%, 40% { transform: scale(1,1); } 55% { transform: scale(1.08,1.12); } 70% { transform: scale(.95,1.04); } 85% { transform: scale(1.03,1.0); } 100% { transform: scale(1,1); } }

/* menús y ventanas */
.scrim { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.6); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: min(520px, 100%); max-height: 86vh; overflow-y: auto; background: var(--wood-2); border: 2px solid var(--wood-4); border-bottom: 0; border-radius: 18px 18px 0 0; padding: 14px 14px calc(16px + env(safe-area-inset-bottom, 0px)); animation: up .18s ease-out; }
@keyframes up { from { transform: translateY(30px); opacity: 0; } }
.sheet-h { padding: 4px 6px 10px; display: grid; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 6px; }
.sheet-h strong { font: 700 22px/1.1 var(--font-display); letter-spacing: .04em; overflow-wrap: anywhere; }
.sheet-h span { color: var(--chalk-dim); font-size: 13px; overflow-wrap: anywhere; }
.mi { display: flex; width: 100%; align-items: center; gap: 14px; border: 0; background: transparent; padding: 13px 8px; border-radius: 10px; font-weight: 600; text-align: left; font-size: 15px; }
.mi:hover, .mi:active { background: var(--wood-3); }
.mi .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mi small { color: var(--chalk-dim); }
.mi.danger { color: #FF9C8C; }
.pickl { max-height: 40vh; overflow-y: auto; }
.warn { margin: 8px 6px 14px; color: #FFB4A8; }
.dlg-btns { display: flex; gap: 10px; justify-content: flex-end; padding: 4px 4px 0; }
.nameform { display: grid; gap: 14px; padding: 4px; }
.search.plain { padding-left: 18px; }
.toast { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; background: var(--chalk); color: var(--wood); font-weight: 700; padding: 10px 18px; border-radius: 999px; max-width: 90vw; box-shadow: 0 8px 24px rgba(0,0,0,.5); text-align: center; }
.spin svg { animation: seamspin .9s linear infinite; }
@media (max-width: 900px) { .vl { height: 56vh; } }
@media (max-width: 440px) { .led { font-size: 24px; } .scoreboard .mid { min-width: 78px; } .stage.withmaza .target { flex-basis: 170px; } }
.dribbler.go .dr-ball { animation-duration: .42s; } .dribbler.go .dr-spin { animation-duration: .42s; } .dribbler.go .dr-body { animation-duration: .42s; }
.dribbler.go .dr-arm { animation-duration: .42s; } .dribbler.go .dr-legA, .dribbler.go .dr-legB { animation-duration: .84s; } .dribbler.go .dr-bshadow { animation-duration: .42s; }
@media (prefers-reduced-motion: reduce) { .rim.shot *, .pball.spin .seams { animation: none !important; } }

html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); background: #18120E; }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
